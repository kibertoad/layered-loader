name: publish

# Changesets-driven release pipeline.
#
# Pushes to `main` land in one of three modes, decided by `changesets/action/select-mode`:
#
#   version — unreleased changesets exist. Opens (or refreshes) the "chore: release" pull
#             request holding the version bumps and CHANGELOG entries, and turns on
#             auto-merge for it when a RELEASE_TOKEN secret is configured.
#   publish — no changesets left and a package version is not on the registry yet, i.e. the
#             release pull request has just been merged. Publishes it, tags it, and creates
#             the GitHub release.
#   none    — nothing to do.
#
# IMPORTANT: the *file name* of this workflow is part of the npm trusted publisher
# configuration for `layered-loader` and `@layered-loader/sqs`. Renaming this file breaks
# OIDC publishing until the trusted publisher is updated on npmjs.com.
#
# Auto-merging the release pull request needs a RELEASE_TOKEN secret (a fine-grained PAT or
# GitHub App token with `contents: write` + `pull-requests: write`). Pull requests opened by
# the built-in GITHUB_TOKEN do not start workflow runs, so a merge performed with it would
# never reach the publish mode above. Without the secret the release pull request is still
# opened and kept up to date — it just waits for a human to merge it.

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: select mode
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          always-auth: false
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      # `secrets` is not available in `if:` conditions, so surface its presence as an env var.
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          always-auth: false
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The action pushes the release branch through the GitHub API rather than the Git CLI,
      # so no credentials need to be persisted by the checkout above.
      - name: Create or update the release pull request
        id: changesets
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          script: pnpm run changeset:version
          commit-message: 'chore: release'
          pr-title: 'chore: release'

      - name: Enable auto-merge on the release pull request
        if: env.HAS_RELEASE_TOKEN == 'true' && steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail

          # Auto-merge queues the merge behind the required checks. GitHub rejects it when the
          # repository has "Allow auto-merge" turned off, and also when the pull request is
          # already mergeable with nothing to wait for; both fall back to merging outright —
          # the contents of a release pull request are generated, not authored.
          if ! gh pr merge "$PR" --auto --squash; then
            echo "::notice::Could not queue an auto-merge for #$PR, merging it directly instead"
            gh pr merge "$PR" --squash
          fi

  publish:
    name: publish
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest

    permissions:
      # Git tags and GitHub releases for the published versions.
      contents: write
      # npm trusted publishing (OIDC) — this is what authenticates the publish, and what
      # gets the published packages their provenance attestation.
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          always-auth: false
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before publishing so a broken build fails the run before anything reaches the
      # registry. @layered-loader/sqs type-checks against the root package's published types
      # (dist/index.d.ts), so the root has to be built first — which `-r` orders for us. The
      # `benchmark` workspace project is never published and has nothing to build.
      - name: Build
        run: pnpm -r --include-workspace-root --filter '!benchmark' run build

      - name: Lint
        run: pnpm -r --include-workspace-root --filter '!benchmark' run lint

      - name: Publish to npm
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: pnpm run changeset:publish
        env:
          # Belt and braces: trusted publishing attaches provenance on its own, this makes it
          # explicit for the `pnpm publish` invocations `changeset publish` shells out to.
          NPM_CONFIG_PROVENANCE: true
