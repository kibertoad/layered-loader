packages:
  # The root project is itself a published package. pnpm treats it as a workspace project
  # either way, but listing it is what makes Changesets version and publish it.
  - '.'
  - 'packages/*'
  - 'benchmark'

minimumReleaseAgeExclude:
  - toad-cache@3.7.4

onlyBuiltDependencies:
  - '@biomejs/biome'
